<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITC O&amp;M Cost Dashboard</title><meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { color-scheme: light; --font-anthropic-sans: 'IBM Plex Sans Thai', 'Sarabun', system-ui, sans-serif; --font-anthropic-serif: 'IBM Plex Sans Thai', 'Sarabun', system-ui, sans-serif;
 --color-bg: #F6F7FB; --color-panel: #FFFFFF; --color-fg: #1B1D3A; --color-fg-muted: #5E6283; --color-border-line: #DDE0EC; --color-ok: #1E8E5A; --color-bad: #C62F2F;
 --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 12px; --cds-gap-lg: 16px; --cds-gap-xl: 24px; --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 12px; --cds-pad-lg: 18px; --cds-pad-xl: 24px;
 --cds-radius: 10px; --cds-font-size-caption: 12px; --cds-font-size-body: 14px; --cds-font-size-heading: 16px; --cds-font-size-title: 26px; --cds-font-weight-medium: 600;
 --cds-chart-grid: #E6E8F0; --cds-chart-axis: #8A8FAE; --cds-chart-reference: #8A8FAE; --cds-surface-popover: #FFFFFF; --cds-shadow-popover: 0 6px 24px rgba(16,17,63,.18);
 --cds-border: 1px solid #DDE0EC; --cds-text-secondary: #5E6283; --cds-dur-slow: .3s; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --color-bg: #11132B; --color-panel: #1A1D3D; --color-fg: #EEF0FA; --color-fg-muted: #A3A8C8; --color-border-line: #2E3260;
 --cds-chart-grid: #2A2E58; --cds-chart-axis: #8A8FAE; --cds-surface-popover: #1F2347; --cds-border: 1px solid #2E3260; --cds-text-secondary: #A3A8C8; } }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: 14px; }
#dash-root { max-width: 1440px; margin: 0 auto; padding: 0 16px 32px; box-sizing: border-box; }
.dash-skeleton { min-height: 1.2em; background: linear-gradient(90deg, var(--color-border-line), transparent, var(--color-border-line)); background-size: 200% 100%; animation: sk 1.2s infinite linear; border-radius: 6px; opacity: .5; }
@keyframes sk { to { background-position: -200% 0; } }


#dash-root { --dash-gutter: var(--cds-pad-md); }
.om { font-family: var(--font-anthropic-sans); color: var(--color-fg); }
.om h1 { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); margin: 0; text-wrap: balance; line-height: 1.2; }
.om h2 { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); margin: 0; }
.om h3 { font-size: var(--cds-font-size-body); font-weight: var(--cds-font-weight-medium); margin: 0; }
.om .muted { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.om button { font: inherit; }

/* ---------- login ---------- */
.om .login { display: flex; justify-content: center; padding-block: var(--cds-pad-xl); }
.om .lcard { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); width: 100%; max-width: 920px; border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); overflow: hidden; background: var(--color-panel); }
@media (max-width: 720px) { .om .lcard { grid-template-columns: 1fr; } }
.om .lside { padding: var(--cds-pad-xl); display: flex; flex-direction: column; gap: var(--cds-gap-md); justify-content: space-between; background: var(--color-bg); border-right: 1px solid var(--color-border-line); }
.om .lside .big { font-family: var(--font-anthropic-serif); font-size: var(--cds-font-size-title); line-height: 1.2; }
.om .lside ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 4px; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.om .lform { padding: var(--cds-pad-xl); display: flex; flex-direction: column; gap: var(--cds-gap-md); }
.om .field { display: flex; flex-direction: column; gap: 4px; }
.om .field label { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.om .inp { font: inherit; padding: 9px 12px; border-radius: var(--cds-radius); border: 1px solid var(--color-border-line); background: var(--color-bg); color: var(--color-fg); width: 100%; box-sizing: border-box; }
.om .inp:focus-visible { outline: 2px solid var(--cds-chart-reference); outline-offset: 1px; }
.om .pw { position: relative; }
.om .pw .inp { padding-right: 4.5rem; }
.om .pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--color-fg-muted); cursor: pointer; font-size: var(--cds-font-size-caption); padding: 4px 6px; }
.om .btn { font: inherit; padding: 9px 16px; border-radius: var(--cds-radius); border: 1px solid var(--color-fg); background: var(--color-fg); color: var(--color-bg); cursor: pointer; font-weight: 600; }
.om .btn[disabled] { opacity: .5; cursor: default; }
.om .btn.ghost { background: transparent; color: var(--color-fg); border-color: var(--color-border-line); font-weight: 400; }
.om .err { color: var(--color-bad); font-size: var(--cds-font-size-caption); min-height: 1.2em; }
.om .roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--cds-gap-xs); }
.om .role { border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: 8px; font-size: var(--cds-font-size-caption); }
.om .role b { display: block; font-weight: 600; color: var(--color-fg); }
.om .role span { color: var(--color-fg-muted); }
.om .lfoot { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); border-top: 1px solid var(--color-border-line); padding-top: var(--cds-pad-sm); }

/* ---------- app shell ---------- */
.om .top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cds-gap-sm); padding: var(--cds-pad-sm) var(--cds-pad-md); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: var(--color-panel); }
.om .brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.om .brand b { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-heading); }
.om .go { position: relative; }
.om .go .inp { width: 15rem; max-width: 60vw; padding: 6px 10px; font-size: var(--cds-font-size-caption); }
.om .golist { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20; background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); padding: 4px; }
.om .golist button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 4px; color: var(--color-fg); cursor: pointer; font-size: var(--cds-font-size-caption); }
.om .golist button:hover, .om .golist button:focus-visible { background: var(--cds-chart-grid); }
.om .who { display: flex; flex-direction: column; line-height: 1.25; padding-left: var(--cds-pad-sm); border-left: 1px solid var(--color-border-line); }
.om .who b { font-size: var(--cds-font-size-caption); font-weight: 600; }
.om .tbtn { background: none; border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: 5px 10px; color: var(--color-fg); cursor: pointer; font-size: var(--cds-font-size-caption); }
.om .tbtn:hover { border-color: var(--color-fg-muted); }
.om .shell { display: grid; grid-template-columns: 14.5rem minmax(0, 1fr); gap: var(--cds-gap-md); margin-top: var(--cds-gap-md); align-items: start; }
@media (max-width: 860px) { .om .shell { grid-template-columns: 1fr; } }
.om nav.side { border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: var(--color-panel); padding: var(--cds-pad-sm); display: flex; flex-direction: column; gap: var(--cds-gap-sm); position: sticky; top: var(--cds-pad-sm); }
@media (max-width: 860px) { .om nav.side { position: static; } .om nav.side .grp { display: flex; flex-wrap: wrap; gap: 4px; } .om nav.side .gl { width: 100%; } .om nav.side .nb { width: auto; } .om nav.side .credit { display: none; } }
.om .gl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--color-fg-muted); padding: 4px 8px 2px; }
.om .nb { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 7px 8px; color: var(--color-fg); cursor: pointer; font-size: var(--cds-font-size-caption); }
.om .nb:hover { background: var(--cds-chart-grid); }
.om .nb[aria-current="page"] { background: var(--color-fg); color: var(--color-bg); font-weight: 600; }
.om .nb .cnt { margin-left: auto; opacity: .6; font-variant-numeric: tabular-nums; }
.om .nb[disabled] { opacity: .45; cursor: not-allowed; }
.om .nb .ic { width: 16px; height: 16px; flex: none; }
.om .credit { font-size: 11px; color: var(--color-fg-muted); border-top: 1px solid var(--color-border-line); padding: var(--cds-pad-sm) 8px 2px; line-height: 1.5; }
.om main { min-width: 0; display: flex; flex-direction: column; gap: var(--cds-gap-lg); }
.om .ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--cds-gap-sm); }
.om .crumb { font-size: 11px; color: var(--color-fg-muted); margin-bottom: 2px; }
.om .sub { margin: 4px 0 0; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); max-width: 80ch; }

/* filter bar */
.om .bar { display: grid; gap: var(--cds-gap-sm); padding: var(--cds-pad-md); background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); }
.om .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cds-gap-xs); }
.om .ctl > .lbl { width: 7.5rem; flex: none; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); text-transform: uppercase; letter-spacing: .06em; }
@media (max-width: 760px) { .om .ctl > .lbl { width: 100%; } }
.om .chip { font: inherit; font-size: var(--cds-font-size-caption); padding: 5px 12px; border-radius: 999px; border: 1px solid var(--color-border-line); background: var(--color-bg); color: var(--color-fg); cursor: pointer; }
.om .chip:hover { border-color: var(--color-fg-muted); }
.om .chip[aria-pressed="true"] { background: var(--color-fg); color: var(--color-bg); border-color: var(--color-fg); }
.om .chip[disabled] { opacity: .45; cursor: not-allowed; }
.om .chip:focus-visible, .om .nb:focus-visible, .om .tbtn:focus-visible, .om .btn:focus-visible { outline: 2px solid var(--cds-chart-reference); outline-offset: 2px; }
.om .chip .n { opacity: .6; margin-left: 4px; }
.om .lvlnote { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }

/* cards & content */
.om .card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg); display: flex; flex-direction: column; gap: var(--cds-gap-sm); min-width: 0; }
.om .card > header { display: flex; flex-direction: column; gap: 2px; }
.om .prof { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr); gap: var(--cds-gap-md); }
@media (max-width: 1000px) { .om .prof { grid-template-columns: 1fr; } }
.om .pname { font-family: var(--font-anthropic-serif); font-size: var(--cds-font-size-title); font-weight: 400; line-height: 1.2; }
.om .pill { display: inline-block; font-size: var(--cds-font-size-caption); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--color-border-line); margin-right: 6px; }
.om .specs { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: var(--cds-gap-sm); margin-top: var(--cds-gap-xs); }
.om .spec { border-top: 1px solid var(--color-border-line); padding-top: var(--cds-pad-xs); }
.om .spec .v { font-family: var(--font-anthropic-serif); font-size: var(--cds-font-size-heading); font-variant-numeric: tabular-nums; }
.om .spec .u { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.om .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: var(--cds-gap-md); }
.om .kpi .v { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); font-variant-numeric: tabular-nums; line-height: 1.15; }
.om .kpi .k, .om .kpi .s { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.om .split { height: 8px; border-radius: 4px; overflow: hidden; display: flex; background: var(--cds-chart-grid); margin-top: 6px; }
.om .split span { display: block; height: 100%; }
.om .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: var(--cds-gap-md); }
.om .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: var(--cds-gap-md); }
.om .tcard { cursor: pointer; text-align: left; color: var(--color-fg); }
.om .tcard:hover { border-color: var(--color-fg-muted); }
.om .tcard .v { font-family: var(--font-anthropic-serif); font-size: var(--cds-font-size-title); font-variant-numeric: tabular-nums; }
.om .chart { position: relative; min-height: 300px; }
.om .chart.tall { min-height: 340px; }
.om .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.om .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.om svg text { fill: var(--color-fg-muted); font-size: 11px; font-family: var(--font-anthropic-sans); }
.om svg .grid line { stroke: var(--cds-chart-grid); }
.om svg .domain, .om svg .tick line { stroke: var(--cds-chart-axis); }
.om .tip { position: absolute; pointer-events: none; background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); padding: var(--cds-pad-xs) var(--cds-pad-sm); font-size: var(--cds-font-size-caption); z-index: 5; min-width: 12rem; max-width: 20rem; }
.om .tip .h { color: var(--cds-text-secondary); margin-bottom: 4px; }
.om .tip .r { display: flex; gap: 8px; justify-content: space-between; font-variant-numeric: tabular-nums; }
.om .tip .r span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.om .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.om .tools { display: flex; flex-wrap: wrap; gap: var(--cds-gap-sm); align-items: center; justify-content: space-between; }
.om input[type=search] { font: inherit; font-size: var(--cds-font-size-caption); padding: 6px 10px; border-radius: var(--cds-radius); border: 1px solid var(--color-border-line); background: var(--color-bg); color: var(--color-fg); width: 16rem; max-width: 100%; }
.om .tbox { overflow: auto; max-height: 34rem; border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); }
.om table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: var(--cds-font-size-caption); font-variant-numeric: tabular-nums; }
.om th, .om td { padding: 6px 10px; border-bottom: 1px solid var(--color-border-line); text-align: right; white-space: nowrap; background: var(--color-panel); }
.om th { position: sticky; top: 0; z-index: 2; font-weight: var(--cds-font-weight-medium); color: var(--color-fg-muted); }
.om th button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.om .tl { text-align: left; }
.om .stick { position: sticky; left: 0; z-index: 1; }
.om th.stick { z-index: 3; }
.om td.item { white-space: normal; min-width: 16rem; max-width: 26rem; text-align: left; }
.om td.wrap { white-space: normal; min-width: 14rem; text-align: left; }
.om .bar-cell { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
.om .bar-cell .b { height: 8px; border-radius: 4px; }
.om .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
.om tbody tr.pick td { background: var(--cds-chart-grid); }
.om .click tbody tr { cursor: pointer; }
.om .click tbody tr:hover td { background: var(--cds-chart-grid); }
.om .note { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); max-width: 90ch; margin: 0; }
.om .lock { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: var(--cds-pad-xl); text-align: center; color: var(--color-fg-muted); }
.om .yes { color: var(--color-ok); font-weight: 600; }
.om .no { color: var(--color-fg-muted); }
.om [data-dash-source-state=refreshing] { opacity: .5; transition: opacity var(--cds-dur-slow); }
.om [data-dash-source-state=empty] { color: transparent; }
.om .fail { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 120px; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
.om .fail::before { content: ""; width: .375rem; height: .375rem; border-radius: 50%; background: var(--color-bad); }

/* ---------- Infratrans brand theme: blue + orange ---------- */
.om { --b-blue: #232A7A; --b-blue-deep: #10113F; --b-orange: #F47028; --b-orange-soft: rgba(244, 112, 40, .14); --b-blue-soft: rgba(35, 42, 122, .10); --b-on: #FFFFFF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .om { --b-blue: #8F96E0; --b-blue-soft: rgba(143, 150, 224, .18); --b-orange-soft: rgba(244, 112, 40, .22); } }
:root[data-theme="dark"] .om { --b-blue: #8F96E0; --b-blue-soft: rgba(143, 150, 224, .18); --b-orange-soft: rgba(244, 112, 40, .22); }
.om h1 { color: var(--b-blue); }
.om .top { background: linear-gradient(90deg, var(--b-blue-deep), #232A7A); border-color: transparent; color: var(--b-on); border-bottom: 3px solid var(--b-orange); }
.om .top .muted, .om .top .who .muted { color: rgba(255, 255, 255, .72); }
.om .top .brand b { color: var(--b-on); }
.om .top .who { border-left-color: rgba(255, 255, 255, .25); }
.om .top .tbtn { color: var(--b-on); border-color: rgba(255, 255, 255, .35); }
.om .top .tbtn:hover { border-color: var(--b-on); background: rgba(255, 255, 255, .1); }
.om .top .go .inp { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .3); color: var(--b-on); }
.om .top .go .inp::placeholder { color: rgba(255, 255, 255, .6); }
.om .top .logo { height: 34px; width: auto; background: #FFFFFF; border-radius: 6px; padding: 3px 6px; }
.om .nb[aria-current="page"] { background: var(--b-blue-soft); color: var(--b-blue); box-shadow: inset 3px 0 0 var(--b-orange); }
.om .gl { color: var(--b-orange); font-weight: 600; }
.om .chip[aria-pressed="true"] { background: var(--b-blue); border-color: var(--b-blue); color: var(--b-on); }
.om .chip:hover { border-color: var(--b-blue); }
.om .bar { border-top: 3px solid var(--b-blue); }
.om .ctl > .lbl { color: var(--b-blue); font-weight: 600; }
.om .kpi .v, .om .tcard .v, .om .spec .v, .om .pname { color: var(--b-blue); }
.om .kpi:first-child .v { color: var(--b-orange); }
.om .tcard:hover { border-color: var(--b-orange); }
.om tbody tr.pick td { background: var(--b-orange-soft); }
.om .click tbody tr:hover td { background: var(--b-blue-soft); }
.om th { color: var(--b-blue); }
.om .btn { background: var(--b-orange); border-color: var(--b-orange); color: #FFFFFF; }
.om .btn:hover:not([disabled]) { filter: brightness(.95); }
.om .yes { color: var(--b-blue); }

/* ---------- login: logo + sign-in only ---------- */
.om .login { min-height: 70vh; align-items: center; }
.om .lbox { width: 100%; max-width: 400px; background: var(--color-panel); border: 1px solid var(--color-border-line); border-top: 4px solid var(--b-orange); border-radius: var(--cds-radius); padding: var(--cds-pad-xl); display: flex; flex-direction: column; gap: var(--cds-gap-md); }
.om .lbox .lg { display: flex; justify-content: center; padding-bottom: var(--cds-pad-sm); border-bottom: 1px solid var(--color-border-line); }
.om .lbox .lg img { max-height: 72px; width: auto; max-width: 100%; }
.om .lbox .lg .name { font-family: var(--font-anthropic-serif); font-size: var(--cds-font-size-title); color: var(--b-blue); }
.om .lbox h2 { color: var(--b-blue); text-align: center; }
.om .inp:focus-visible { outline-color: var(--b-blue); }

/* ---------- left-side tabs ---------- */
.om nav.side { position: static; max-height: none; }
.om .nb[aria-pressed="true"] { background: var(--b-blue); color: var(--b-on); font-weight: 600; }
.om .nb[aria-pressed="true"] .cnt { opacity: .85; }
.om .nb .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; flex: none; opacity: .6; }
.om .nb[aria-pressed="true"] .dot { background: var(--b-on); opacity: 1; }
.om .nb .sub2 { display: block; font-size: 11px; opacity: .7; font-weight: 400; white-space: normal; }

  const store = { accounts: ACCOUNTS }; const calcs = {}; let cache = {}; const cbs = [];
  let params = { type: 'All', project: 'M82', level: 'SEPO', scenario: 'ALL', metric: 'total' };
  let enc = null; const encP = fetch('data.enc.json', { cache: 'no-store' }).then((r) => r.json()).then((j) => { enc = j; }).catch(() => {});

<script>
// ================= calculations (readers can open these in Sources) =================
dash.calc('proj_totals', {
  title: 'Project 30-year totals by stage and case',
  description: 'Sums each project, study stage (SEPO or RFP) and cost case over its operating years (30, or 12 for RAP), split into operation, system maintenance (groups named ระบบ, or items named งานระบบ) and other maintenance.',
  inputs: ['om_items', 'projects'],
  fn: (om_items, projects) => {
    const by = new Map();
    for (const r of om_items) {
      const key = r.project + '|' + r.stage + '|' + r.scenario;
      const t = by.get(key) || { key, project: r.project, stage: r.stage, scenario: r.scenario, nyears: Number(r.nyears) || 30, total: 0, operation: 0, maintenance: 0, maint_system: 0, maint_other: 0, years: Array(30).fill(0), yearsO: Array(30).fill(0), yearsM: Array(30).fill(0) };
      const v = Number(r.total_30y) || 0;
      t.total += v;
      if (r.sec === 'Operation') t.operation += v; else { t.maintenance += v; if (/ระบบ/.test(r.grp) || /งานระบบ/.test(r.item)) t.maint_system += v; else t.maint_other += v; }
      for (let i = 0; i < 30; i++) { const y = Number(r['y' + String(i + 1).padStart(2, '0')]) || 0; t.years[i] += y; if (r.sec === 'Operation') t.yearsO[i] += y; else t.yearsM[i] += y; }
      by.set(key, t);
    }
    return [...by.values()].map((t) => {
      const p = projects.find((x) => x.project === t.project) || {};
      const unit = p.type === 'Rest Area' ? Number(p.rest_area_sites) : Number(p.distance_km);
      return { ...t, avg_year: t.total / t.nyears, unit_basis: p.type === 'Rest Area' ? 'site' : 'km', per_unit_year: unit ? t.total / t.nyears / unit : null };
    });
  },
});
dash.calc('group_totals', {
  title: 'Totals by the model’s own cost groups',
  description: 'Sums line items within each cost group exactly as the model groups them, for each project, stage and case, by year and over 30 years.',
  inputs: ['om_items'],
  fn: (om_items) => {
    const by = new Map();
    for (const r of om_items) {
      const key = r.project + '|' + r.stage + '|' + r.scenario + '|' + r.grp;
      const t = by.get(key) || { key, project: r.project, stage: r.stage, scenario: r.scenario, grp: r.grp, sec: r.sec, order: r.seq, items: 0, total: 0, models: [], years: Array(30).fill(0) };
      if (r.grp_model && r.grp_model !== r.grp && !t.models.includes(r.grp_model)) t.models.push(r.grp_model);
      t.total += Number(r.total_30y) || 0; t.items += 1; t.order = Math.min(t.order, r.seq);
      for (let i = 0; i < 30; i++) t.years[i] += Number(r['y' + String(i + 1).padStart(2, '0')]) || 0;
      by.set(key, t);
    }
    return [...by.values()];
  },
});

// ---------- password hashing (SHA-256) ----------
async function sha256(str) {
  const bytes = new TextEncoder().encode(str);
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', bytes);
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }
  // fallback for browsers without SubtleCrypto
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = bytes.length, n = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(n); m.set(bytes); m[l] = 0x80;
  const dv = new DataView(m.buffer); dv.setUint32(n - 4, l * 8); dv.setUint32(n - 8, Math.floor(l / 0x20000000));
  const w = new Uint32Array(64), r = (x, c) => (x >>> c) | (x << (32 - c));
  for (let o = 0; o < n; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) { const s0 = r(w[i-15],7) ^ r(w[i-15],18) ^ (w[i-15] >>> 3), s1 = r(w[i-2],17) ^ r(w[i-2],19) ^ (w[i-2] >>> 10); w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0; }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++) { const t1 = (h + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0, t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0; h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0; }
    H = H.map((x, i) => (x + [a,b,c,d,e,f,g,h][i]) | 0);
  }
  return H.map((x) => (x >>> 0).toString(16).padStart(8, '0')).join('');
}


// ================= charts =================
function measure(svg, texts) { const tx = svg.append('text').attr('font-size', 11); let w = 0; for (const s of texts) { tx.text(s); w = Math.max(w, tx.node().getComputedTextLength()); } tx.remove(); return w; }
function tipFor(box) { let tp = box.querySelector('.tip'); if (!tp) { tp = mk('div', 'tip'); tp.hidden = true; box.append(tp); } return tp; }
function showTip(box, tip, ev, head, rows) {
  tip.replaceChildren(mk('div', 'h', head));

  tip.hidden = false;
  const bb = box.getBoundingClientRect(); const x = ev.clientX - bb.left, y = ev.clientY - bb.top; const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.max(0, Math.min(bb.width - tw, x + 14 > bb.width - tw ? x - tw - 14 : x + 14)) + 'px';
  tip.style.top = Math.max(0, Math.min(bb.height - th, y - th / 2)) + 'px';

function stackedBars(box, labels, series, yl) {

  const svg = d3.select(box).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`);
  const totals = labels.map((_, i) => d3.sum(series, (s) => Math.max(0, s.values[i])));
  const y = d3.scaleLinear([0, d3.max(totals) || 1], [H - 28, 10]).nice();
  const ml = measure(svg, y.ticks(5).map((v) => d3.format(',')(v))) + 12;
  const x = d3.scaleBand(labels, [ml, W - 8]).padding(0.22);
  svg.append('g').attr('class', 'grid').selectAll('line').data(y.ticks(5)).join('line').attr('x1', ml).attr('x2', W - 8).attr('y1', y).attr('y2', y);
  svg.append('g').attr('transform', `translate(${ml - 4},0)`).call(d3.axisLeft(y).ticks(5).tickSize(0).tickFormat(d3.format(','))).attr('font-size', null).attr('font-family', null).call((g) => g.select('.domain').remove());
  const every = W < 520 ? 5 : W < 900 ? 2 : 1;
  svg.append('g').attr('transform', `translate(0,${H - 28})`).call(d3.axisBottom(x).tickSize(0).tickPadding(8).tickValues(labels.filter((_, i) => i % every === 0 || i === labels.length - 1))).attr('font-size', null).attr('font-family', null);
  const base = labels.map(() => 0);
  series.forEach((s) => { const g = svg.append('g'); labels.forEach((l, i) => { const v = Math.max(0, s.values[i]); if (!v) return; g.append('rect').attr('x', x(l)).attr('width', x.bandwidth()).attr('y', y(base[i] + v)).attr('height', Math.max(0, y(base[i]) - y(base[i] + v))).attr('fill', s.color); base[i] += v; }); });
  const tip = tipFor(box);
  svg.append('g').selectAll('rect').data(labels).join('rect').attr('x', (l) => x(l) - x.step() * x.paddingInner() / 2).attr('width', x.step()).attr('y', 0).attr('height', H - 28).attr('fill', 'transparent')
    .on('mousemove', (ev, l) => { const i = labels.indexOf(l); const rows = series.filter((s) => s.values[i]).map((s) => ({ color: s.color, name: s.name, value: fmt(s.values[i]) })).reverse(); rows.push({ name: t('รวม', 'Total'), value: fmt(totals[i]) }); showTip(box, tip, ev, yl(i), rows); })
    .on('mouseleave', () => { tip.hidden = true; });
}
function hBars(box, rows, onClick) {

function lines(box, labels, series, yl, fmtv) {

  const svg = d3.select(box).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`);
  const y = d3.scaleLinear([0, d3.max(series, (s) => d3.max(s.values)) || 1], [H - 28, 12]).nice();
  const ml = measure(svg, y.ticks(5).map((v) => d3.format(',')(v))) + 12;
  const endW = measure(svg, series.map((s) => s.end || '')) + 10;
  const x = d3.scalePoint(labels, [ml, W - Math.min(endW, W * 0.3) - 6]);
  svg.append('g').attr('class', 'grid').selectAll('line').data(y.ticks(5)).join('line').attr('x1', ml).attr('x2', x.range()[1]).attr('y1', y).attr('y2', y);
  svg.append('g').attr('transform', `translate(${ml - 4},0)`).call(d3.axisLeft(y).ticks(5).tickSize(0).tickFormat(d3.format(','))).attr('font-size', null).attr('font-family', null).call((g) => g.select('.domain').remove());
  const every = W < 520 ? 5 : 3;
  svg.append('g').attr('transform', `translate(0,${H - 28})`).call(d3.axisBottom(x).tickSize(0).tickPadding(8).tickValues(labels.filter((_, i) => i % every === 0 || i === labels.length - 1))).attr('font-size', null).attr('font-family', null);

  ends.sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 12) ends[i].y = ends[i - 1].y + 12;
  ends.forEach((e) => svg.append('text').attr('x', x.range()[1] + 6).attr('y', e.y).attr('dy', '0.35em').style('fill', e.s.color).text(e.s.end));
  const tip = tipFor(box);
  const rule = svg.append('line').attr('y1', 12).attr('y2', H - 28).attr('stroke', 'var(--cds-chart-reference)').attr('opacity', 0);
  svg.append('rect').attr('x', ml).attr('y', 0).attr('width', Math.max(0, x.range()[1] - ml)).attr('height', H - 28).attr('fill', 'transparent')
    .on('mousemove', (ev) => { const [mx] = d3.pointer(ev); const i = Math.max(0, Math.min(labels.length - 1, Math.round((mx - ml) / (x.step() || 1)))); rule.attr('x1', x(labels[i])).attr('x2', x(labels[i])).attr('opacity', 1); showTip(box, tip, ev, yl(i), series.map((s) => ({ color: s.color, name: s.name, value: (fmtv || fmt)(s.values[i]) }))); })
    .on('mouseleave', () => { tip.hidden = true; rule.attr('opacity', 0); });
}

async function doLogin() {
  const acc = dash.data('accounts');
  const u = el('u').value.trim().toLowerCase(), pw = el('p').value, code = el('lv').value.trim().toUpperCase();
  el('ferr').textContent = '';
  if (!u || !pw || !code) { el('ferr').textContent = t('กรุณากรอกอีเมล รหัสผ่าน และรหัสพนักงาน 3 ตัว', 'Enter the email, password and your 3-letter staff code'); return; }
  if (!/^[A-Z]{3}$/.test(code)) { el('ferr').textContent = t('ระดับการใช้งานต้องเป็นรหัสพนักงานภาษาอังกฤษ 3 ตัว เช่น ABC', 'Usage level must be a 3-letter staff code, e.g. ABC'); return; }
  if (acc.status !== 'ok') { el('ferr').textContent = t('ยังโหลดข้อมูลผู้ใช้ไม่เสร็จ ลองอีกครั้ง', 'User data is still loading. Try again.'); return; }
  const login = acc.data.find((r) => r.kind === 'login');
  const domain = login ? String(login.username).toLowerCase().replace(/^\*/, '') : '@infratrans.co.th';
  if (!/^[^\s@]+@[^\s@]+$/.test(u) || !u.endsWith(domain)) { el('ferr').textContent = t('ใช้อีเมลพนักงานที่ลงท้ายด้วย ' + domain, 'Use your staff email ending in ' + domain); return; }
  el('go').disabled = true; el('go').textContent = t('กำลังตรวจสอบ…', 'Checking…');
  const h = login ? await sha256(login.salt + ':' + pw) : null;
  el('go').disabled = false; el('go').textContent = t('เข้าสู่ระบบ', 'Sign in');
  if (!login || h !== login.sha256) { el('ferr').textContent = t('รหัสผ่านไม่ถูกต้อง', 'Wrong password'); el('p').value = ''; return; }
  if (window.__unlock && !(await window.__unlock(pw))) { el('ferr').textContent = t('ถอดรหัสข้อมูลไม่สำเร็จ ลองรีเฟรชหน้า', 'Could not unlock the data. Refresh and try again.'); return; }
  const lv = acc.data.find((r) => r.kind === 'level' && r.code === code) || acc.data.find((r) => r.kind === 'level' && r.code === '*');
  session = { username: u, code, role: lv ? lv.role : 'user' };
  el('p').value = '';

  render();
}

function render() {

  el('who-n').textContent = session.code + ' · ' + session.username;
  el('who-r').textContent = t(ROLES[session.role].th, ROLES[session.role].en);

  const pj = dash.data('projects'), om = dash.data('om_items'), pt = dash.data('proj_totals'), gt = dash.data('group_totals');
  if ([pj, om].some((d) => d.status === 'error')) { el('page').replaceChildren(mk('div', 'fail', 'Failed to load')); return; }
  if (![pj, om, pt, gt].every((d) => d.status === 'ok')) { el('page').replaceChildren(mk('div', 'card dash-skeleton', ' ')); return; }

  const perms = PERMS[session.role];

  const projects = pj.data, items = om.data, ptot = pt.data, gtot = gt.data;
  let { type = 'All', project = 'M82', level = 'SEPO', scenario = 'ALL', metric = 'total' } = P();
  const inType = projects.filter((p) => type === 'All' || p.type === type);
  if (!inType.some((p) => p.project === project)) project = (inType[0] || projects[0]).project;
  const proj = projects.find((p) => p.project === project);
  const stages = proj.stages.split('|');
  if (!stages.includes(level)) level = stages[0];
  const cases = (proj['cases_' + level] || '').split('|').filter(Boolean);
  if (scenario !== 'ALL' && !cases.includes(scenario)) scenario = 'ALL';
  const firstYear = proj['first_year_' + level];
  const ny = Number(proj['nyears_' + level]) || 30;
  state = { projects, items, ptot, gtot, type, project, level, scenario, metric, proj, stages, cases, inType, perms, firstYear, ny, YS: YK.slice(0, ny) };
  el('t-sub').textContent = t(`${projects.length} โครงการ · หน่วย ล้านบาท`, `${projects.length} projects · Million THB`);

  drawNav();

}

  const { projects, ptot, type } = state;

  hero.append(hl);
  const heads = projects.map(headline).filter(Boolean);
  const hk = mk('div', 'hk'); hero.append(hk);
  const hv = (label, v) => { const d = mk('div'); d.append(mk('b', null, v), mk('span', null, label)); hk.append(d); };
  hv(t('โครงการ', 'projects'), String(projects.length));

  hv(t('ล้านบาท · ค่า O&M ตลอดอายุแบบจำลอง (SEPO, PSC)', 'MB · O&M over each model period (SEPO, PSC)'), fmt(d3.sum(heads, (r) => r.total)));

  const types = TYPES.slice(1);
  for (const ty of types) {
    const ps = projects.filter((p) => p.type === ty); if (!ps.length) continue;
    const sec = mk('section', 'tsec'); sec.id = 'type-' + ty.replace(' ', '-').toLowerCase(); m.append(sec);
    const hd = mk('div', 'thead'); const tyl = mk('span', 'ty'); tyl.append(mk('i'), mk('h2', null, typeName(ty))); hd.append(tyl, mk('span', 'badge', ps.length + t(' โครงการ', ps.length > 1 ? ' projects' : ' project'))); sec.append(hd);
    const grid = mk('div', 'pgrid'); sec.append(grid);
    for (const p of ps) {
      const tt = headline(p);
      const c = mk('div', 'pcard'); c.dataset.source = 'projects'; c.addEventListener('click', () => go('profile', { project: p.project, type: p.type }));
      const top2 = mk('div', 'top2'); top2.append(agBadge(p));
      const w = mk('div', 'who2'); w.append(mk('span', 'code', pname(p) + ' · ' + t(p.agency_th, p.agency_en)));
      const nm = mk('button', 'nm', t(p.name_th, p.name)); nm.type = 'button'; nm.addEventListener('click', (e) => { e.stopPropagation(); go('profile', { project: p.project, type: p.type }); }); w.append(nm);
      top2.append(w); c.append(top2);
      const facts = mk('div', 'facts');
      const fact = (label, v, unit) => { if (v == null || v === '') return; const sp = mk('span'); sp.append(document.createTextNode(label + ' '), mk('b', null, typeof v === 'string' ? v : d3.format(',')(v)), document.createTextNode(unit ? ' ' + unit : '')); facts.append(sp); };
      if (p.type === 'Rest Area') { fact(t('ที่พักริมทาง', 'Sites'), p.rest_area_sites, t('แห่ง', 'sites')); fact(t('ขนาด', 'Size'), raSizeText(p)); fact(t('พื้นที่', 'Area'), p.area_rai, t('ไร่', 'rai')); }
      else {
        fact(t('ระยะทาง', 'Distance'), p.distance_km, t('กม.', 'km'));
        if (p.type === 'Railway') fact(t('สถานี', 'Stations'), p.stations);
        else { fact(t('ด่าน', 'Tolls'), p.toll_plazas); fact(t('ช่องจราจร', 'Lanes'), p.lanes); }

// PSC or PPP figures for a project at a stage: one row, the contracts added up, or each PPP variant (Gross / Net); PPP (รัฐ) is left out
function cmpRows(p, st, kind) {
  const rs = state.ptot.filter((r) => r.project === p.project && r.stage === st);

  };

// ---- Assumptions per sub-item: PSC, PPP, or the two side by side ----
let aq = '', aMode = 'PSC';
// the rows standing for one case kind of a project stage: the case itself, or its sites / contracts added up, or PPP (Gross Cost)
function kindItems(items, project, level, kind) {
  const rs = items.filter((r) => r.project === project && r.stage === level && r.scenario.startsWith(kind) && !/รัฐ/.test(r.scenario));
  const cases = [...new Set(rs.map((r) => r.scenario))];
  let use = cases.includes(kind) ? [kind] : cases.some((c) => /\(/.test(c)) ? [cases.find((c) => /Gross/.test(c)) || cases[0]] : cases;
  const by = new Map();
  for (const r of rs.filter((x) => use.includes(x.scenario))) {
    const k = r.code || r.item; const o = by.get(k);
    if (!o) by.set(k, { ...r, total: r.total_30y }); else o.total += r.total_30y;
  }
  return { cases: use, rows: by };
}

  const tb = mk('div', 'tbox tall'); tb.dataset.source = 'om_items item_notes'; c1.append(tb);

  const keys = [...K.PSC.rows.keys()].concat([...K.PPP.rows.keys()].filter((k) => !K.PSC.rows.has(k)));
  const note = (k) => notes.status === 'ok' ? notes.data.find((x) => x.project === project && x.stage === level && x.code === k) : null;
  const draw = () => {

    heads.forEach(([l, c]) => hr.append(mk('th', c, l)));
    const ncol = heads.length; const body = tab.createTBody(); let lastG = null;
    if (notes.status !== 'ok') { const tr = body.insertRow(); const td = tr.insertCell(); td.colSpan = ncol; td.className = 'dash-skeleton'; td.textContent = ' '; return; }
    let sP = 0, sQ = 0;
    for (const k of keys) {
      const a = K.PSC.rows.get(k), b = K.PPP.rows.get(k), r = cmp ? (a || b) : K[aMode].rows.get(k); if (!r) continue;
      const n = note(k) || {};

      const A = n['a_' + lc] || (aMode === 'PSC' ? n.assumption : '') || '—', E = n['e_' + lc] || r.escalation || '—', V = n['v_' + lc] || r.vat || '—';

      if (qq && !hay.join(' ').toLowerCase().includes(qq)) continue;

      const both = (lc2) => { const td = cell(n['a_' + lc2] || '—', 'sumtxt half'); const ev = [n['e_' + lc2], n['v_' + lc2]].filter(Boolean).join(' · '); if (ev) td.append(mk('span', 'ev', ev)); };
      both('psc'); both('ppp'); cell(n.diff || '—', 'difftxt');

      const d = pv && qv != null ? (qv - pv) / pv : null; const dc = cell(d == null ? '—' : d3.format('+.1%')(d)); if (d != null) dc.className = d < -0.0005 ? 'neg' : d > 0.0005 ? 'pos' : '';
    }

      [fmt2(sP), fmt2(sQ), sP ? d3.format('+.1%')((sQ - sP) / sP) : '—'].forEach((x) => { const c = tr.insertCell(); c.textContent = x; });
    }
  };
  q.addEventListener('input', () => { aq = q.value; draw(); });
  draw();
}

const MODEL_SLOTS = [
  ['M82', 'M82', 'RFP'], ['RPM', 'M82', 'SEPO'], ['PPK', 'PPK', 'SEPO'], ['SSP', 'SSP', 'SEPO'], ['ET1', 'ET1', 'SEPO'], ['PPK_RA', 'PPK_RA', 'SEPO'],

];
// ITC1 files: 'ITC1' + salt + iv + AES-GCM, key from the staff password (same as the build)
async function itcKey(salt, use) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(window.__pw || ''), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, [use]);
}
async function itcEnc(bytes) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await itcKey(salt, 'encrypt'), bytes));
  const out = new Uint8Array(32 + ct.length); out.set(new TextEncoder().encode('ITC1')); out.set(salt, 4); out.set(iv, 20); out.set(ct, 32); return out;
}
async function itcDec(bytes) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(20, 32) }, await itcKey(bytes.slice(4, 20), 'decrypt'), bytes.slice(32)));
}
// decrypted layout image for a site (plans are stored encrypted)
const planCache = new Map();
async function planUrl(path) {
  if (!/\.enc$/.test(path)) return path;
  if (!planCache.has(path)) {
    const r = await fetch(path, { cache: 'no-store' }); if (!r.ok) throw new Error(r.status);
    const u8 = await itcDec(new Uint8Array(await r.arrayBuffer()));
    const mime = u8[0] === 0x89 ? 'image/png' : u8[0] === 0x25 ? 'application/pdf' : u8[0] === 0x52 ? 'image/webp' : 'image/jpeg';
    planCache.set(path, URL.createObjectURL(new Blob([u8], { type: mime })));
  }
  return planCache.get(path);
}
